services:
  # ── Databases ──
  # MongoDB: replica set 1 node + xác thực + keyFile (giải thích ở docker-compose.yml).
  # Production KHÔNG có mật khẩu mặc định: thiếu biến nào thì `docker compose` dừng ngay (cú pháp
  # `${VAR:?}`). Đặt trong file .env trên server. Mật khẩu chứa ký tự đặc biệt (@ : / ? # %)
  # phải được mã hoá URL (percent-encode) khi nằm trong chuỗi kết nối MONGO_URI bên dưới.
  mongodb:
    image: mongo:7
    container_name: nexusmart-mongodb
    restart: unless-stopped
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -f /data/configdb/keyfile ]; then openssl rand -base64 756 > /data/configdb/keyfile; fi
        chmod 400 /data/configdb/keyfile
        chown mongodb:mongodb /data/configdb/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/configdb/keyfile --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?cần đặt MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:?cần đặt MONGO_ROOT_PASS}
      MONGO_APP_PASS: ${MONGO_APP_PASS:?cần đặt MONGO_APP_PASS}
      MONGO_BACKUP_PASS: ${MONGO_BACKUP_PASS:?cần đặt MONGO_BACKUP_PASS}
      MONGO_READONLY_PASS: ${MONGO_READONLY_PASS:?cần đặt MONGO_READONLY_PASS}
    ports:
      - "0.0.0.0:27017:27017"
    volumes:
      - mongodata:/data/db
      - ./scripts/mongo/init-users.js:/docker-entrypoint-initdb.d/10-init-users.js:ro
      - ./scripts/mongo/users.config.js:/mongo-scripts/users.config.js:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - -u
        - ${MONGO_ROOT_USER}
        - -p
        - ${MONGO_ROOT_PASS}
        - --authenticationDatabase
        - admin
        - --eval
        - "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}); quit(1) }"
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: nexusmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-keycloak}
      POSTGRES_USER: ${PG_USER:-keycloak}
      POSTGRES_PASSWORD: ${PG_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-keycloak}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Keycloak ──
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.4
    container_name: nexusmart-keycloak
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${PG_DB:-keycloak}
      KC_DB_USERNAME: ${PG_USER:-keycloak}
      KC_DB_PASSWORD: ${PG_PASS}
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8180
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    command: start
    volumes:
      - ./keycloak/themes/shofy-theme:/opt/keycloak/themes/shofy-theme
      - ./keycloak/themes/shofy-crm-theme:/opt/keycloak/themes/shofy-crm-theme
      - ./keycloak/scripts:/opt/keycloak/scripts:ro
    ports:
      - "127.0.0.1:8180:8180"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Backend API ──
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/dtug20/nexusmart-backend:latest}
    container_name: nexusmart-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://nexus_app:${MONGO_APP_PASS:?}@mongodb:27017/nexusmart?authSource=admin&replicaSet=rs0
      PORT: 4000
      NODE_ENV: production
      KEYCLOAK_JWKS_URI: http://keycloak:8180/realms/shofy/protocol/openid-connect/certs
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      mongodb:
        condition: service_healthy

  # ── Frontend ──
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/dtug20/nexusmart-frontend:latest}
    container_name: nexusmart-frontend
    restart: unless-stopped
    environment:
      PORT: 3001
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - backend

  # ── CRM ──
  crm:
    image: ${CRM_IMAGE:-ghcr.io/dtug20/nexusmart-crm:latest}
    container_name: nexusmart-crm
    restart: unless-stopped
    env_file: ./crm/.env
    environment:
      MONGO_URI: mongodb://nexus_app:${MONGO_APP_PASS:?}@mongodb:27017/nexusmart?authSource=admin&replicaSet=rs0
      NODE_ENV: production
      CRM_PORT: 8081
      BACKEND_API_URL: http://backend:4000
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy

  # ── Nginx Reverse Proxy ──
  nginx:
    image: nginx:alpine
    container_name: nexusmart-nginx
    restart: unless-stopped
    ports:
      - "81:80"
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
      - crm
      - keycloak

volumes:
  mongodata:
  pgdata:
