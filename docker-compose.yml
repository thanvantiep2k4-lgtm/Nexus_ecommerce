services:
  # MongoDB chạy ở chế độ REPLICA SET 1 node (rs0) có XÁC THỰC.
  #  - replica set: bắt buộc để dùng transaction (đặt hàng + trừ kho + ghi sổ cái nguyên tử).
  #    MongoDB đơn lẻ không hỗ trợ transaction.
  #  - xác thực + keyFile: MongoDB đòi keyFile khi bật xác thực cho replica set. KeyFile là chuỗi bí
  #    mật các node dùng để tin nhau; với 1 node chỉ cần tồn tại. Tự sinh lúc khởi động bên dưới.
  #  - user: root tạo từ MONGO_INITDB_ROOT_*; các user ứng dụng (nexus_app, nexus_backup,
  #    nexus_readonly) tạo bởi scripts/mongo/init-users.js. Xem scripts/mongo/users.config.js.
  # Mật khẩu mặc định dưới đây CHỈ dành cho máy dev; production phải đặt mật khẩu riêng
  # (docker-compose.prod.yml bắt buộc khai báo, không có mặc định).
  # LƯU Ý: root và user chỉ được tạo khi thư mục dữ liệu còn TRỐNG. Đã có volume mongodata từ bản
  # MongoDB cũ (không xác thực) thì phải xoá volume đó một lần, xem docs/PROJECT_PLAN.md mục 3.
  mongodb:
    image: mongo:7
    container_name: nexusmart-mongodb
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -f /data/configdb/keyfile ]; then openssl rand -base64 756 > /data/configdb/keyfile; fi
        chmod 400 /data/configdb/keyfile
        chown mongodb:mongodb /data/configdb/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/configdb/keyfile --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-root_dev_password}
      MONGO_APP_PASS: ${MONGO_APP_PASS:-nexus_app_dev_password}
      MONGO_BACKUP_PASS: ${MONGO_BACKUP_PASS:-nexus_backup_dev_password}
      MONGO_READONLY_PASS: ${MONGO_READONLY_PASS:-nexus_readonly_dev_password}
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      - ./scripts/mongo/init-users.js:/docker-entrypoint-initdb.d/10-init-users.js:ro
      - ./scripts/mongo/users.config.js:/mongo-scripts/users.config.js:ro
    healthcheck:
      # Healthy khi node đã là PRIMARY. Lần đầu chưa có replica set thì khởi tạo nó (rs.initiate).
      # Máy ngoài Docker (npm run dev) kết nối bằng directConnection=true, xem backend/.env.example.
      test:
        - CMD
        - mongosh
        - --quiet
        - -u
        - ${MONGO_ROOT_USER:-root}
        - -p
        - ${MONGO_ROOT_PASS:-root_dev_password}
        - --authenticationDatabase
        - admin
        - --eval
        - "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}); quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: nexusmart-postgres
    environment:
      POSTGRES_DB: ${PG_DB:-keycloak}
      POSTGRES_USER: ${PG_USER:-keycloak}
      POSTGRES_PASSWORD: ${PG_PASS:-keycloak_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.4
    container_name: nexusmart-keycloak
    env_file: .env
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${PG_DB:-keycloak}
      KC_DB_USERNAME: ${PG_USER:-keycloak}
      KC_DB_PASSWORD: ${PG_PASS:-keycloak_password}
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME: ${KEYCLOAK_URL:-http://localhost:8180}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8180
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes/shofy-theme:/opt/keycloak/themes/shofy-theme
      - ./keycloak/themes/shofy-crm-theme:/opt/keycloak/themes/shofy-crm-theme
    ports:
      - "8180:8180"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusmart-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://nexus_app:${MONGO_APP_PASS:-nexus_app_dev_password}@mongodb:27017/nexusmart?authSource=admin&replicaSet=rs0
      PORT: 4000
      STORE_URL: http://localhost:3001
      ADMIN_URL: http://localhost:8081
    env_file:
      - ./backend/.env

  crm:
    build:
      context: ./crm
      dockerfile: Dockerfile
    container_name: nexusmart-crm
    restart: unless-stopped
    ports:
      - "${CRM_PORT:-8081}:8081"
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://backend:4000
      CRM_PORT: 8081
    env_file:
      - ./crm/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexusmart-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://backend:4000
      PORT: 3001
    env_file:
      - ./frontend/.env.local

volumes:
  mongodata:
  pgdata:
